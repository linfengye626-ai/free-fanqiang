name: 每日 Top10 节点更新

on:
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间 09:00 自动运行
  workflow_dispatch:      # 也可以在 Actions 页面手动点运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Top10 节点文件
        run: |
          pip install pyyaml -q
          python3 - <<'PYEOF'
          import base64, json, urllib.parse, urllib.request
          import yaml

          # 混合协议配额（只用 TCP 协议，hysteria2 在部分网络下被拦截）
          QUOTA = {"ss": 3, "trojan": 3, "vless": 2, "vmess": 2}
          CLASH_URLS = [
              "https://cdn.jsdelivr.net/gh/Au1rxx/free-vpn-subscriptions@main/output/clash.yaml",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml",
          ]
          V2RAY_URLS = [
              "https://cdn.jsdelivr.net/gh/Au1rxx/free-vpn-subscriptions@main/output/v2ray-base64.txt",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt",
          ]

          def fetch(urls):
              for u in urls:
                  try:
                      req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=40) as r:
                          data = r.read()
                          if r.status == 200 and len(data) > 1000:
                              return data
                  except Exception:
                      pass
              raise RuntimeError("上游订阅下载失败")

          def link_name(link):
              if link.startswith("vmess://"):
                  try:
                      d = json.loads(base64.b64decode(link.split("://", 1)[1] + "===").decode())
                      return d.get("ps") or ""
                  except Exception:
                      return ""
              return urllib.parse.unquote(link.split("#")[-1]) if "#" in link else ""

          # 上游 clash.yaml 里偶尔有坏数据（如 network: raw / network: tcp#...），
          # 直接透传会导致客户端解析失败。这里只允许合法的传输类型。
          CLASH_NETWORKS = {"tcp", "http", "h2", "ws", "grpc"}

          def valid_proxy(p):
              if not p.get("server") or not p.get("port"):
                  return False
              t = p.get("type")
              if t in ("vmess", "vless"):
                  if not p.get("uuid"):
                      return False
                  net = p.get("network")
                  if net is not None and net not in CLASH_NETWORKS:
                      return False
              elif t == "ss":
                  if not p.get("cipher") or not p.get("password"):
                      return False
              elif t == "trojan":
                  if not p.get("password"):
                      return False
              else:
                  return False
              return True

          raw = fetch(V2RAY_URLS).decode().strip()
          links = [l for l in base64.b64decode(raw).decode(errors="ignore").splitlines() if l.strip()]
          clash_by_name = {p["name"]: p for p in yaml.safe_load(fetch(CLASH_URLS)).get("proxies", [])}

          picked, need, skipped = [], dict(QUOTA), 0
          for link in links:
              if all(v == 0 for v in need.values()):
                  break
              proto = link.split("://")[0]
              if proto not in need or need[proto] == 0:
                  continue
              name = link_name(link)
              if name not in clash_by_name:
                  continue
              if not valid_proxy(clash_by_name[name]):
                  skipped += 1
                  continue  # 坏数据跳过，不占用配额，继续往后找
              picked.append(link)
              need[proto] -= 1

          proxies = [clash_by_name[link_name(l)] for l in picked]
          names = [p["name"] for p in proxies]
          clash_cfg = {
              "port": 7890, "socks-port": 7891, "allow-lan": True,
              "mode": "rule", "log-level": "info",
              "proxies": proxies,
              "proxy-groups": [
                  {"name": "🚀 手动选择", "type": "select", "proxies": names},
                  {"name": "♻️ 自动选择", "type": "url-test",
                   "url": "http://www.gstatic.com/generate_204",
                   "interval": 300, "proxies": names},
              ],
              "rules": ["MATCH,🚀 手动选择"],
          }
          with open("top10-clash.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(clash_cfg, f, allow_unicode=True, sort_keys=False)

          with open("top10-v2ray.txt", "w", encoding="utf-8") as f:
              f.write(base64.b64encode(("\n".join(picked)).encode()).decode())

          print(f"OK: {len(proxies)} clash / {len(picked)} v2ray（跳过坏数据 {skipped} 个）")
          PYEOF

      - name: 提交更新
        run: |
          git config user.name "node-bot"
          git config user.email "node-bot@localhost"
          git add top10-clash.yaml top10-v2ray.txt
          git commit -m "每日 Top10 更新" || echo "无变化"
          git push
